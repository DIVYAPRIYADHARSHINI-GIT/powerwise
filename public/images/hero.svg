<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="A home with rooftop solar, a smart meter and energy flowing to appliances">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
  </defs>
  <rect x="20" y="20" width="520" height="380" rx="40" fill="url(#sky)"/>
  <!-- sun -->
  <g transform="translate(452 92)">
    <circle r="58" fill="#fde68a" opacity=".45"/>
    <circle r="36" fill="url(#sun)"/>
    <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
      <path d="M0-50v-12M0 50v12M-50 0h-12M50 0h12M-35-35l-8-8M35 35l8 8M-35 35l-8 8M35-35l8-8"/>
    </g>
  </g>
  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <ellipse cx="118" cy="84" rx="40" ry="15"/><ellipse cx="146" cy="74" rx="26" ry="18"/>
    <ellipse cx="318" cy="58" rx="30" ry="11"/><ellipse cx="338" cy="50" rx="18" ry="13"/>
  </g>
  <!-- ground -->
  <path d="M20 330c90-22 170-26 260-18s170 6 260-14v62a40 40 0 0 1-40 40H60a40 40 0 0 1-40-40z" fill="#bbf7d0"/>
  <path d="M20 352c120-16 260-20 520-8v16a40 40 0 0 1-40 40H60a40 40 0 0 1-40-40z" fill="#86efac"/>
  <!-- house -->
  <rect x="132" y="196" width="236" height="142" rx="6" fill="url(#wall)" stroke="#334155" stroke-width="4"/>
  <path d="M108 204 250 98l142 106" fill="none" stroke="url(#roof)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- solar panels on roof -->
  <g transform="translate(268 116) rotate(36.7)">
    <rect width="92" height="30" rx="3" fill="url(#panel)" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M23 0v30M46 0v30M69 0v30M0 15h92" stroke="#93c5fd" stroke-width="1.6"/>
  </g>
  <!-- chimney -->
  <rect x="156" y="124" width="24" height="44" rx="3" fill="#f97316" stroke="#334155" stroke-width="4"/>
  <!-- door -->
  <rect x="226" y="262" width="48" height="76" rx="6" fill="#fbbf24" stroke="#334155" stroke-width="4"/>
  <circle cx="264" cy="302" r="4" fill="#334155"/>
  <!-- windows: one with a lamp, one with an AC -->
  <rect x="152" y="220" width="58" height="52" rx="6" fill="#fef9c3" stroke="#334155" stroke-width="4"/>
  <path d="M181 220v52M152 246h58" stroke="#334155" stroke-width="3"/>
  <circle cx="167" cy="234" r="6" fill="#facc15"/>
  <rect x="290" y="220" width="58" height="52" rx="6" fill="#e0f2fe" stroke="#334155" stroke-width="4"/>
  <rect x="297" y="228" width="44" height="14" rx="4" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
  <path d="M304 250c-2 4 2 6 0 10M319 250c-2 4 2 6 0 10M334 250c-2 4 2 6 0 10" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- smart meter on the wall -->
  <g transform="translate(392 238)">
    <path d="M-24 30H0" stroke="#334155" stroke-width="4"/>
    <rect x="0" y="0" width="74" height="92" rx="12" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <rect x="10" y="12" width="54" height="28" rx="5" fill="#064e3b"/>
    <text x="37" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">0412</text>
    <text x="37" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">kWh</text>
    <circle cx="22" cy="74" r="6" fill="#10b981"/>
    <circle cx="52" cy="74" r="6" fill="#fbbf24"/>
  </g>
  <!-- energy flow from panels to meter -->
  <path d="M372 190c40 0 64 14 66 44" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- floating badges: bolt + rupee saving + chart -->
  <g transform="translate(60 150)">
    <rect width="70" height="70" rx="20" fill="#fff" stroke="#fbbf24" stroke-width="4"/>
    <path d="M39 12 22 38h12l-3 20 18-28H37z" fill="#f59e0b"/>
  </g>
  <g transform="translate(406 146)">
    <rect width="110" height="46" rx="23" fill="#059669"/>
    <text x="55" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">-₹420</text>
  </g>
  <g transform="translate(52 254)">
    <rect width="84" height="60" rx="14" fill="#fff" stroke="#10b981" stroke-width="4"/>
    <path d="M14 44V30M30 44V22M46 44V34M62 44V16" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- plant -->
  <g transform="translate(470 300)">
    <path d="M10 36V10" stroke="#047857" stroke-width="4"/>
    <path d="M10 18c-14-2-18-12-16-20 10 0 16 8 16 20zM10 14c12-2 16-12 14-20-10 0-14 8-14 20z" fill="#10b981"/>
    <rect x="-2" y="34" width="24" height="16" rx="3" fill="#f97316"/>
  </g>
</svg>
